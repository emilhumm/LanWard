<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · LanWard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}">
</head>
<body class="login-page">
<div class="ambient" aria-hidden="true"></div>
<main class="login-wrap">
  <form class="login-card" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="login-brand">
      <span class="brand-tile" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5l3.2 11.5L12 9.5l5.3 8.5 3.2-11.5"/></svg></span>
      LanWard
    </div>
    <p class="login-sub">Sign in to your network dashboard</p>

    {% if error %}<p class="login-err">{{ error }}</p>{% endif %}

    <label class="login-field">
      <span class="lbl">Password</span>
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    <button type="submit" class="login-btn">Sign in</button>

    {% if is_default %}
    <p class="login-hint">First time? The default password is <code>{{ default_password | default('lanward') }}</code> —
      change it in Settings once you're in.</p>
    {% endif %}
  </form>
</main>
</body>
</html>
